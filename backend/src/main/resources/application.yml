spring:
  application:
    name: apaar-platform-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    # A plain JDBC URL works as-is. Platform connection strings supplied through
    # SPRING_DATASOURCE_URL, DATABASE_URL, or DB_URL (for example Render's
    # postgres://user:pass@host:5432/database) are normalised at startup by
    # DatabaseUrlEnvironmentPostProcessor.
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/apaar}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:apaar}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_BYTES:52428800}
      max-request-size: ${FILE_UPLOAD_MAX_BYTES:52428800}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  # Hosting platforms such as Render inject PORT; BACKEND_PORT remains the local
  # and Docker Compose setting.
  port: ${PORT:${BACKEND_PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.apaar.platform: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} req=%X{requestId:-} - %msg%n"

app:
  security:
    jwt:
      issuer: apaar-platform
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}s
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}s
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login:
      max-failed-attempts: 5
      lock-duration: 15m
  apaar:
    simulated-adapter:
      enabled: ${APAAR_SIMULATED_ENABLED:true}
      adapter-name: simulated-apaar-adapter
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 10s
    threshold: 0.65
  upload:
    storage-dir: ${UPLOAD_STORAGE_DIR:/tmp/apaar-uploads}
    max-file-size-bytes: ${FILE_UPLOAD_MAX_BYTES:52428800}
    allowed-content-types: text/csv,application/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  audit:
    ip-hash-salt: ${AUDIT_IP_HASH_SALT:local-audit-salt-change-me}
  timezone:
    display-zone: Asia/Kolkata

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
logging:
  level:
    com.apaar.platform: DEBUG
