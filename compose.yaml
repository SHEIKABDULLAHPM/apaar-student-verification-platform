name: apaar-student-verification-platform

services:
  db:
    image: postgres:16-alpine
    container_name: apaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apaar}
      POSTGRES_USER: ${POSTGRES_USER:-apaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apaar} -d ${POSTGRES_DB:-apaar}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apaar_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apaar-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-apaar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-apaar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only-32-bytes-minimum-secret-key}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-5242880}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - apaar_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: apaar-ai-service
    restart: unless-stopped
    environment:
      AI_PORT: 8000
      AI_ENV: development
      AI_MODEL_VERSION: 0.1.0
      AI_ANOMALY_THRESHOLD: 0.65
      LOG_LEVEL: INFO
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apaar_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: apaar-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - apaar_network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: apaar-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - apaar_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: apaar-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - apaar_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  apaar_network:
    driver: bridge

